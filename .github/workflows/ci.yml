name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.1

      - name: Enable repository-pinned pnpm
        shell: bash
        run: |
          set -euo pipefail

          readonly expected_package_manager="pnpm@10.34.5"
          readonly declared_package_manager="$(node -p "require('./package.json').packageManager")"

          test "${declared_package_manager}" = "${expected_package_manager}"
          corepack enable
          corepack prepare "${expected_package_manager}" --activate
          test "$(pnpm --version)" = "10.34.5"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package for type-aware linting
        run: pnpm --filter @vynema/shared build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
